<!doctype html>
<html lang="en">
	<head>
		<!-- Character encoding -->
		<meta charset="UTF-8" />

		<!-- Responsive layout -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO -->
		<title>Genuflexio</title>
		<meta
			name="description"
			content="Discover the Catholic liturgical calendar and daily celebrations, and explore the lives of the saints through masterpieces of sacred art."
		/>

		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://genuflexio.com" />

		<!-- Theme / Browser -->
		<!--Handled by <PageMetaThemeColor /> component-->

		<!-- Open Graph / Facebook / Meta / WhatsApp -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Genuflexio" />
		<meta
			property="og:title"
			content="Genuflexio - Discover Catholic Liturgy and Sacred Art"
		/>
		<meta
			property="og:description"
			content="Discover the Catholic liturgical calendar and daily celebrations, and explore the lives of the saints through masterpieces of sacred art."
		/>
		<meta property="og:url" content="https://genuflexio.com" />

		<meta property="og:image" content="https://genuflexio.com/meta.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/png" />
		<meta
			property="og:image:alt"
			content="Genuflexio - Discover Catholic Liturgy and Sacred Art"
		/>

		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="fr_FR" />
		<meta property="og:locale:alternate" content="la_VA" />

		<!-- X / Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Genuflexio" />
		<meta
			name="twitter:description"
			content="Discover the Catholic liturgical calendar and daily celebrations, and explore the lives of the saints through masterpieces of sacred art."
		/>
		<meta name="twitter:image" content="https://genuflexio.com/meta.png" />
		<meta
			name="twitter:image:alt"
			content="Genuflexio - Discover Catholic Liturgy and Sacred Art"
		/>
	</head>

		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
